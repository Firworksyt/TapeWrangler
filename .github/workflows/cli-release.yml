name: Release CLI

# Push a tag like cli-v0.2.0 to publish CLI binaries as a GitHub Release:
#   git tag cli-v0.2.0 && git push origin cli-v0.2.0
on:
  push:
    tags: [ 'cli-v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - run: go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/tapewrangler-$os-$arch$ext" .
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes
