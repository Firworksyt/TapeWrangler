name: Build and Push Docker Image

# Only server changes publish a new image, so CLI-only commits don't make
# watchtower restart the server.
on:
  push:
    branches: [ master ]
    paths:
      - 'server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set build metadata
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:test
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}

      - name: Smoke test container
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name smoke -p 3000:3000 -e TAPEWRANGLER_TOKEN=smoke \
            -v "$PWD/data:/app/data" ${{ env.IMAGE }}:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/version; then break; fi
            sleep 1
          done
          echo
          # Exercise the database: import a file list and search for it.
          printf 'photos/beach.jpg\t123\n' | curl -fsS --data-binary @- \
            -H 'Authorization: Bearer smoke' http://localhost:3000/api/tapes/SMOKE1L6/files
          echo
          curl -fsS 'http://localhost:3000/api/search?q=beach' | grep -q SMOKE1L6
          curl -fsS http://localhost:3000/ | grep -q TapeWrangler
          docker logs smoke
          docker rm -f smoke

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
